<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#0b0b0d"/><title>Band Song Vote v13</title><link rel="stylesheet" href="styles.css?v=20260904-13"/></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">BAND SETLIST PICKER · v13</p><h1>공연곡 월드컵</h1></div><button id="resetBtn" class="icon-btn" type="button" aria-label="처음부터 다시하기">↻</button></header><section class="hero" id="introView"><div class="hero-card"><span class="pill">5명 투표 → 최종 5곡</span><h2>다섯 명 의견을 모으자.</h2><p>각자 월드컵을 한 번씩 진행합니다. 공정성을 위해 종합 결과는 5명 모두 투표한 뒤 공개됩니다.</p><div class="flow"><div><strong>01</strong><span>랜덤 1:1 대결<br>10 → 5</span></div><div><strong>02</strong><span>패자부활전<br>5 → 1</span></div><div><strong>03</strong><span>최종 탈락전<br>6 → 5</span></div></div><div id="collectiveBox" class="collective-box"></div><div class="name-select"><span class="name-select-label">누가 투표하나요?</span><div class="name-grid"><button class="name-btn" type="button" data-name="철우">철우</button><button class="name-btn" type="button" data-name="예인">예인</button><button class="name-btn" type="button" data-name="영웅">영웅</button><button class="name-btn" type="button" data-name="아린">아린</button><button class="name-btn" type="button" data-name="규빈">규빈</button></div></div><button id="startBtn" class="primary-btn" type="button" disabled>이름을 선택하세요</button></div></section><section id="gameView" class="game-view hidden" aria-live="polite"><div class="status-row"><div><p id="stageLabel" class="stage-label">1차 대결</p><h2 id="stageTitle">더 공연하고 싶은 곡은?</h2></div><span id="progressText" class="progress-text">1 / 5</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div id="matchArea" class="match-area"></div><p id="hintText" class="hint">카드를 눌러 한 곡을 선택하세요.</p></section><section id="resultView" class="result-view hidden"><div class="result-head"><span class="pill accent">MY FINAL 5</span><span id="resultOwner" class="result-owner"></span><h2>내 투표 완료</h2><p id="saveStatus">공용 집계에 저장 중…</p></div><ol id="resultList" class="result-list"></ol><div id="aggregateResult" class="aggregate-result"></div><div class="result-actions"><button id="shareBtn" class="primary-btn" type="button">내 결과 복사</button><button id="restartBtn" class="secondary-btn" type="button">다른 멤버 투표</button></div></section></main><div id="toast" class="toast" role="status"></div><script src="config.js?v=20260904-13"></script><script src="app.js?v=20260904-13"></script><script src="results.js?v=20260904-13"></script></body></html>
