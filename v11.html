<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#f1efe8"/><title>공연곡 투표</title><link rel="stylesheet" href="styles.css?v=20260904-16"/></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">SETLIST VOTE · 2026</p><h1>공연곡 투표</h1></div><button id="resetBtn" class="icon-btn" type="button" aria-label="처음부터 다시하기">↻</button></header><section class="hero" id="introView"><div class="hero-card"><span class="pill">10곡 중 5곡 선택</span><h2>SETLIST<br>VOTE</h2><p>5명이 각각 투표합니다. 최종 결과는 모두 끝난 뒤 공개.</p><div class="flow"><div><strong>01</strong><span>1:1 대결<br>10 → 5</span></div><div><strong>02</strong><span>패자부활<br>+ 1</span></div><div><strong>03</strong><span>한 곡 탈락<br>6 → 5</span></div></div><div id="collectiveBox" class="collective-box"></div><div class="name-select"><span class="name-select-label">투표자 선택</span><div class="name-grid"><button class="name-btn" type="button" data-name="철우">철우</button><button class="name-btn" type="button" data-name="예인">예인</button><button class="name-btn" type="button" data-name="영웅">영웅</button><button class="name-btn" type="button" data-name="아린">아린</button><button class="name-btn" type="button" data-name="규빈">규빈</button></div></div><button id="startBtn" class="primary-btn" type="button" disabled>이름을 선택하세요</button></div></section><section id="gameView" class="game-view hidden" aria-live="polite"><div class="status-row"><div><p id="stageLabel" class="stage-label">1차 대결</p><h2 id="stageTitle">어떤 곡을 할까?</h2></div><span id="progressText" class="progress-text">1 / 5</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div id="matchArea" class="match-area"></div><p id="hintText" class="hint">곡을 눌러 선택</p></section><section id="resultView" class="result-view hidden"><div class="result-head"><span class="pill accent">RESULT</span><span id="resultOwner" class="result-owner"></span><h2>투표 완료</h2><p id="saveStatus">결과 저장 중…</p></div><ol id="resultList" class="result-list"></ol><div id="aggregateResult" class="aggregate-result"></div><div class="result-actions"><button id="shareBtn" class="primary-btn" type="button">내 결과 복사</button><button id="restartBtn" class="secondary-btn" type="button">다른 멤버 투표</button></div></section></main><div id="toast" class="toast" role="status"></div><script src="config.js?v=20260904-16"></script><script src="app.js?v=20260904-16"></script><script src="results.js?v=20260904-16"></script><script src="revote.js?v=20260904-16"></script></body></html>
