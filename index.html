<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Band Song Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260903-3" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">BAND SETLIST PICKER · v3</p>
        <h1>공연곡 월드컵</h1>
      </div>
      <button id="resetBtn" class="icon-btn" type="button" aria-label="처음부터 다시하기">↻</button>
    </header>

    <section class="hero" id="introView">
      <div class="hero-card">
        <span class="pill">10곡 → 최종 5곡</span>
        <h2>딱 5곡만 고르자.</h2>
        <p>1차 대결에서 5곡을 살리고, 탈락곡은 패자부활전으로 한 번 더 기회를 얻습니다.</p>
        <div class="flow">
          <div><strong>01</strong><span>랜덤 1:1 대결<br>10 → 5</span></div>
          <div><strong>02</strong><span>패자부활전<br>5 → 1</span></div>
          <div><strong>03</strong><span>최종 탈락전<br>6 → 5</span></div>
        </div>
        <a class="playlist-link" href="https://youtube.com/playlist?list=PLV3ZKiyBvcMM&si=lwf5Rb7JE2ezjI0p" target="_blank" rel="noreferrer">YouTube 플레이리스트 열기 ↗</a>
        <button id="startBtn" class="primary-btn" type="button">대진 추첨하고 시작</button>
      </div>
    </section>

    <section id="gameView" class="game-view hidden" aria-live="polite">
      <div class="status-row">
        <div>
          <p id="stageLabel" class="stage-label">1차 대결</p>
          <h2 id="stageTitle">더 공연하고 싶은 곡은?</h2>
        </div>
        <span id="progressText" class="progress-text">1 / 5</span>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>

      <div id="matchArea" class="match-area"></div>
      <p id="hintText" class="hint">카드를 눌러 한 곡을 선택하세요.</p>
    </section>

    <section id="resultView" class="result-view hidden">
      <div class="result-head">
        <span class="pill accent">FINAL 5</span>
        <h2>공연곡 확정</h2>
        <p>최종 선택된 5곡입니다.</p>
      </div>
      <ol id="resultList" class="result-list"></ol>
      <div class="result-actions">
        <button id="shareBtn" class="primary-btn" type="button">결과 복사</button>
        <button id="restartBtn" class="secondary-btn" type="button">다시 투표하기</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v=20260903-3"></script>
</body>
</html>
